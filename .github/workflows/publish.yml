name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches package.json: $PKG_VERSION"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (clean)
        run: |
          rm -rf dist
          npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/cli.js || (echo "❌ dist/cli.js missing" && exit 1)
          echo "✅ Build artifacts present"

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort: trigger the docs site (deposium_docs) to rebuild now, so the
      # published CLI reference (its docs/ is synced from this repo at build time)
      # goes live immediately instead of waiting for the docs' nightly cron.
      #
      # Fires on every REAL publish — tag push AND manual non-dry-run — by mirroring
      # the publish step's condition, so manual releases notify the docs too.
      #
      # Security: triggers via workflow_dispatch using the gh CLI (no third-party
      # action to vet/pin). DOCS_DISPATCH_TOKEN only needs "Actions: write" scoped
      # to deposium_docs — it can TRIGGER a rebuild but cannot push content or read
      # secrets, so a leaked token cannot deface the docs site. continue-on-error +
      # the docs' nightly cron mean a missing/expired token never blocks a release.
      #
      # SECRET REQUIRED: DOCS_DISPATCH_TOKEN — a fine-grained PAT scoped to
      # theseedship/deposium_docs with Actions: Read and write (nothing else).
      - name: Notify docs site to rebuild
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo theseedship/deposium_docs
