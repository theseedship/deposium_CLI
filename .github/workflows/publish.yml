name: Stage npm release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the package without staging it'
        type: boolean
        default: true
      check_auth_only:
        description: 'Check npm authentication without building or staging'
        type: boolean
        default: false

# Preserve both running and queued releases, as in the mcp-ui workflow.
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-npm-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.check_auth_only
    runs-on: ubuntu-latest
    steps:
      # Keep this probe independent of repository checkout and package installation.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm authentication
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  stage:
    if: github.event_name != 'workflow_dispatch' || !inputs.check_auth_only
    name: Build and stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag version matches package.json: $PKG_VERSION"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (clean)
        run: |
          rm -rf dist
          npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/cli.js || (echo "dist/cli.js missing" && exit 1)
          echo "Build artifacts present"

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts

      - name: Verify staging npm version
        run: |
          node --version
          npm --version

      - name: Validate package contents (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm pack --dry-run

      - name: Stage for maintainer approval
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: |
          npm stage publish --provenance --access public --tag latest
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Staged $name@$version. It is not public until a maintainer approves it with npm 2FA." >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
