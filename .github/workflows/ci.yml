name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.2', '24.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Type checking
        run: npm run typecheck

      - name: Run documented UI demo (synthetic fixtures only)
        run: npm run demo:ui

      - name: Run tests with coverage
        run: npm run test:coverage

      # Keep compilation in each quality matrix leg: no duplicate npm ci or
      # dependent matrix expansion, while retaining both runtime versions.
      - name: Build TypeScript
        run: npm run build

      - name: Verify compiled entrypoints
        run: |
          test -f dist/cli.js
          test -f dist/index.js
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for TruffleHog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for secrets (Pull Requests)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Check for secrets (Push to main)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
